    <title>🍎 secret</title>
    <style>
        body {
            background: #030101;
            color: #ff4d6d;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a0707 0%, #030101 80%);

        .apple-text {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px #c41e3a;
            animation: floatApple 2s infinite alternate;
            line-height: 2;
        }

        @keyframes floatApple {
            0% { text-shadow: 0 0 15px #c41e3a; transform: scale(1); }
            100% { text-shadow: 0 0 35px #ff4d6d; transform: scale(1.02); }
        }

        .back-link {
            margin-top: 40px;
            font-family: 'Cinzel Decorative', cursive;
            color: #b87c8a;
            text-decoration: none;
            border: 1px solid #4a0b1a;
            padding: 8px 25px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #8b1a2b;
            color: #fff;
            box-shadow: 0 0 15px #c41e3a;
        }
    </style>
</head>
